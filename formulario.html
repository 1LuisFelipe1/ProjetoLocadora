<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locadora de Filmes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div>
        <h1>Cadastro</h1>
        <p>Preencha as informações</p>
    </div>
    <form>
        <label>Nome completo</label>
        <input type="text" name="nome" required>
        <label>CPF</label>
        <input type="number" name="cpf" required>
        <label>Telefone</label>
        <input type="number" name="telefone" placeholder="(99)99999-9999" required>
        <label>Data de nascimento</label>
        <input type="datetime" name="dataDeNascimento" required>
        <label>Endereço</label>
        <input type="text" name="endereco" required>
        <button submit="">Enviar</button>
    </form>
</body>
</html>
